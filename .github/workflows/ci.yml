name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # builds the packages' dist/, which the repository's own configs and the fixtures use
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # ends with publint and attw on each package as it is packed
      - run: pnpm lint
      - name: Fail if lint auto-fixed anything
        run: git diff --exit-code
      - run: pnpm type-check
      # the fixtures, and each config against the configs it replaces
      - run: pnpm test
